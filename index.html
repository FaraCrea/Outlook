<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f6cbd">
<title>Outlook Cepat</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--pri:#0f6cbd;--bd:#d9dde3}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1b2027;--tx:#e8eaed;--mut:#9aa3ad;--bd:#2f3640}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding-bottom:90px}
header{background:var(--pri);color:#fff;padding:14px 16px;font-weight:600;position:sticky;top:0;z-index:5}
main{padding:12px 16px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:80px;resize:vertical}
button{font:inherit;border:0;border-radius:8px;padding:10px 14px;background:var(--pri);color:#fff}
button.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
button.del{background:transparent;color:#c0392b;padding:6px 10px}
.row{display:flex;gap:8px;align-items:center}
.item{border-top:1px dashed var(--bd);padding-top:8px;margin-top:8px}
.item .g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.sub{font-size:13px;color:var(--mut);text-align:right;margin-top:4px}
.total{font-weight:700;text-align:right;margin-top:10px}
.bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 16px;display:flex;gap:8px;z-index:6}
.bar button{flex:1}
pre{white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:8px;font-size:13px;max-height:300px;overflow:auto}
small{color:var(--mut)}
</style>
</head>
<body>
<header>Outlook Cepat</header>
<main>
  <div class="card">
    <div class="row">
      <select id="tpl" style="flex:1"></select>
      <button class="sec" id="newTpl">Baru</button>
    </div>
    <label>Nama template</label><input id="name">
    <div class="row" style="margin-top:8px"><button class="sec" id="dupTpl">Duplikat</button><button class="del" id="delTpl">Hapus template</button></div>
  </div>

  <div class="card">
    <label>Kepada (pisah dengan koma)</label><input id="to" inputmode="email" autocapitalize="off">
    <label>CC</label><input id="cc" inputmode="email" autocapitalize="off">
    <label>Nomor / referensi (isi {ref})</label><input id="ref">
    <label>Subjek <small>— variabel: {ref} {tanggal}</small></label><input id="subject">
    <label>Salam pembuka</label><input id="greet">
    <label>Isi pembuka</label><textarea id="intro"></textarea>
  </div>

  <div class="card">
    <b>Tabel penawaran</b>
    <div id="items"></div>
    <div class="row" style="margin-top:10px"><button class="sec" id="addItem">+ Baris</button>
      <label style="margin:0 0 0 auto"><input type="checkbox" id="useTax" style="width:auto"> PPN</label>
      <input id="taxPct" type="number" value="11" style="width:70px">%</div>
    <div class="total" id="total"></div>
  </div>

  <div class="card">
    <label>Penutup</label><textarea id="closing"></textarea>
    <label>Tanda tangan (berlaku semua template)</label><textarea id="sig"></textarea>
  </div>

  <div class="card">
    <b>Lampiran tetap</b><br><small>Dikirim lewat tombol "Dengan lampiran" (menu bagikan HP ke Outlook).</small>
    <div id="files"></div>
    <input type="file" id="addFile" multiple style="margin-top:8px">
  </div>

  <div class="card">
    <b>Pratinjau</b>
    <pre id="prev"></pre>
    <div class="row"><button class="sec" id="copyBody">Salin isi</button><button class="sec" id="copyHtml">Salin tabel HTML</button></div>
    <label style="color:var(--tx)"><input type="checkbox" id="asTable" checked style="width:auto"> Tabel asli: tabel disalin otomatis, tempel di email (tekan lama → Tempel)</label>
    <label>Metode buka</label>
    <select id="method"><option value="mailto">mailto (aplikasi email default)</option><option value="ms">ms-outlook (coba-coba)</option></select>
  </div>
</main>
<div class="bar">
  <button id="go">OK → Buka Outlook</button>
  <button class="sec" id="goFile">Dengan lampiran</button>
</div>

<script>
const $=id=>document.getElementById(id);
const LS='outlookcepat.v1';
const rp=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');
const uid=()=>Math.random().toString(36).slice(2,9);
const blank=()=>({id:uid(),name:'Template baru',to:'',cc:'',subject:'Penawaran {ref}',greet:'Dengan hormat,',
  intro:'Bersama ini kami sampaikan penawaran sebagai berikut:',closing:'Demikian penawaran ini kami sampaikan. Terima kasih.',
  tax:false,taxPct:11,items:[{item:'',qty:1,unit:'pcs',price:0}]});
let S;
try{S=JSON.parse(localStorage.getItem(LS))}catch(e){}
if(!S||!S.tpls||!S.tpls.length){const t=blank();t.name='Penawaran standar';S={cur:t.id,sig:'Salam,\n',method:'ms',tpls:[t]}}
if(!S.v2){S.v2=1;S.method='mailto'}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
const cur=()=>S.tpls.find(t=>t.id===S.cur)||S.tpls[0];

// ---- IndexedDB lampiran
let db;
const idb=()=>new Promise((ok,no)=>{if(db)return ok(db);const r=indexedDB.open('outlookcepat',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('f',{keyPath:'key',autoIncrement:true});
  r.onsuccess=()=>{db=r.result;ok(db)};r.onerror=()=>no(r.error)});
const fstore=async m=>(await idb()).transaction('f',m).objectStore('f');
const req=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const listFiles=async()=>{try{return (await req((await fstore('readonly')).getAll())).filter(f=>f.tpl===cur().id)}catch(e){return[]}};

function fill(s,t){const d=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
  return s.replace(/\{ref\}/g,$('ref').value).replace(/\{tanggal\}/g,d)}

function totals(t){const sub=t.items.reduce((a,i)=>a+(+i.qty||0)*(+i.price||0),0);
  const tax=t.tax?sub*(+t.taxPct||0)/100:0;return{sub,tax,grand:sub+tax}}

function buildBody(ph){const t=cur(),tt=totals(t);const L=[];
  if(t.greet)L.push(fill(t.greet,t),'');
  if(t.intro)L.push(fill(t.intro,t),'');
  const rows=t.items.filter(i=>i.item.trim());
  if(ph&&rows.length)L.push('[TEMPEL TABEL DI SINI]','');
  else{rows.forEach((i,n)=>{L.push(`${n+1}. ${i.item}`);L.push(`    ${i.qty} ${i.unit} x ${rp(i.price)} = ${rp(i.qty*i.price)}`)});
  if(rows.length){L.push('');if(t.tax){L.push('Subtotal: '+rp(tt.sub));L.push(`PPN ${t.taxPct}%: `+rp(tt.tax))}L.push('TOTAL: '+rp(tt.grand),'')}}
  if(t.closing)L.push(fill(t.closing,t),'');
  if(S.sig)L.push(S.sig);
  return L.join('\n').replace(/\n{3,}/g,'\n\n').trim()}

function buildHtml(){const t=cur(),tt=totals(t);
  const rows=t.items.filter(i=>i.item.trim());
  const td='style="border:1px solid #999;padding:4px 8px"';
  let h='<table style="border-collapse:collapse"><tr>'+['No','Item','Qty','Harga','Total'].map(x=>`<th ${td}>${x}</th>`).join('')+'</tr>';
  rows.forEach((i,n)=>h+=`<tr><td ${td}>${n+1}</td><td ${td}>${i.item}</td><td ${td}>${i.qty} ${i.unit}</td><td ${td} align="right">${rp(i.price)}</td><td ${td} align="right">${rp(i.qty*i.price)}</td></tr>`);
  if(t.tax)h+=`<tr><td ${td} colspan="4" align="right">PPN ${t.taxPct}%</td><td ${td} align="right">${rp(tt.tax)}</td></tr>`;
  h+=`<tr><td ${td} colspan="4" align="right"><b>TOTAL</b></td><td ${td} align="right"><b>${rp(tt.grand)}</b></td></tr></table>`;return h}

// ---- render
function renderTplList(){$('tpl').innerHTML=S.tpls.map(t=>`<option value="${t.id}">${t.name.replace(/</g,'&lt;')}</option>`).join('');$('tpl').value=cur().id}
function renderItems(){const t=cur();
  $('items').innerHTML=t.items.map((i,n)=>`<div class="item" data-n="${n}">
    <input data-k="item" placeholder="Nama item" value="${String(i.item).replace(/"/g,'&quot;')}">
    <div class="g" style="margin-top:6px">
      <input data-k="qty" type="number" inputmode="decimal" placeholder="Qty" value="${i.qty}">
      <input data-k="unit" placeholder="Satuan" value="${i.unit}">
      <input data-k="price" type="number" inputmode="decimal" placeholder="Harga" value="${i.price}">
    </div>
    <div class="row"><span class="sub" style="flex:1;text-align:left" data-sub>${rp(i.qty*i.price)}</span><button class="del" data-del>Hapus</button></div></div>`).join('')}
async function renderFiles(){const fs=await listFiles();
  $('files').innerHTML=fs.map(f=>`<div class="row" style="margin-top:6px"><span style="flex:1">${f.name.replace(/</g,'&lt;')} <small>${Math.round(f.blob.size/1024)} KB</small></span><button class="del" data-f="${f.key}">Hapus</button></div>`).join('')}
function renderAll(){const t=cur();
  renderTplList();$('name').value=t.name;$('to').value=t.to;$('cc').value=t.cc;$('subject').value=t.subject;
  $('greet').value=t.greet;$('intro').value=t.intro;$('closing').value=t.closing;$('sig').value=S.sig;
  $('useTax').checked=t.tax;$('taxPct').value=t.taxPct;$('method').value=S.method;
  renderItems();renderFiles();update()}
function update(){const t=cur(),tt=totals(t);
  $('total').textContent=(t.tax?`Subtotal ${rp(tt.sub)} · PPN ${rp(tt.tax)} · `:'')+'Total '+rp(tt.grand);
  $('prev').textContent='Kepada: '+t.to+'\nCC: '+t.cc+'\nSubjek: '+fill(t.subject,t)+'\n\n'+buildBody();save()}

// ---- events
const bind=(id,k,glob)=>$(id).addEventListener('input',e=>{(glob?S:cur())[k]=e.target.value;if(id==='name')renderTplList();update()});
['to','cc','subject','greet','intro','closing'].forEach(k=>bind(k,k));bind('name','name');bind('sig','sig',true);
$('ref').addEventListener('input',update);
$('method').onchange=e=>{S.method=e.target.value;save()};
$('useTax').onchange=e=>{cur().tax=e.target.checked;update()};
$('taxPct').oninput=e=>{cur().taxPct=+e.target.value;update()};
$('tpl').onchange=e=>{S.cur=e.target.value;renderAll()};
$('newTpl').onclick=()=>{const t=blank();S.tpls.push(t);S.cur=t.id;renderAll()};
$('dupTpl').onclick=()=>{const t=JSON.parse(JSON.stringify(cur()));t.id=uid();t.name+=' (salinan)';S.tpls.push(t);S.cur=t.id;renderAll()};
$('delTpl').onclick=()=>{if(S.tpls.length<2)return alert('Minimal satu template.');if(!confirm('Hapus template ini?'))return;
  S.tpls=S.tpls.filter(t=>t.id!==S.cur);S.cur=S.tpls[0].id;renderAll()};
$('addItem').onclick=()=>{cur().items.push({item:'',qty:1,unit:'pcs',price:0});renderItems();update()};
$('items').addEventListener('input',e=>{const box=e.target.closest('.item');if(!box)return;const n=+box.dataset.n,k=e.target.dataset.k;
  cur().items[n][k]=e.target.type==='number'?+e.target.value:e.target.value;
  const i=cur().items[n];box.querySelector('[data-sub]').textContent=rp(i.qty*i.price);update()});
$('items').addEventListener('click',e=>{if(!e.target.matches('[data-del]'))return;const n=+e.target.closest('.item').dataset.n;
  cur().items.splice(n,1);if(!cur().items.length)cur().items.push({item:'',qty:1,unit:'pcs',price:0});renderItems();update()});
$('addFile').onchange=async e=>{const st=await fstore('readwrite');
  for(const f of e.target.files)st.add({tpl:cur().id,name:f.name,type:f.type,blob:f});
  e.target.value='';setTimeout(renderFiles,200)};
$('files').addEventListener('click',async e=>{const k=e.target.dataset.f;if(!k)return;
  await req((await fstore('readwrite')).delete(+k));renderFiles()});
$('copyBody').onclick=async()=>{await navigator.clipboard.writeText(buildBody());alert('Isi tersalin.')};
$('copyHtml').onclick=async()=>{const h=buildHtml();
  try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([h],{type:'text/html'}),'text/plain':new Blob([buildBody()],{type:'text/plain'})})]);alert('Tabel tersalin. Tempel di badan email Outlook.')}
  catch(err){await navigator.clipboard.writeText(h);alert('Tersalin sebagai kode HTML.')}};

async function copyTable(){try{const h=buildHtml();
  await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([h],{type:'text/html'}),'text/plain':new Blob([buildBody()],{type:'text/plain'})})]);return true}catch(e){return false}}
$('go').onclick=async()=>{const ph=$('asTable').checked&&await copyTable();
  const t=cur(),to=t.to.replace(/\s/g,'').replace(/;/g,','),cc=t.cc.replace(/\s/g,'').replace(/;/g,',');
  const p=[];if(cc)p.push('cc='+encodeURIComponent(cc));
  p.push('subject='+encodeURIComponent(fill(t.subject,t)),'body='+encodeURIComponent(buildBody(ph)));
  location.href=(S.method==='ms'?'ms-outlook://compose?to='+encodeURIComponent(to)+'&':'mailto:'+encodeURIComponent(to).replace(/%2C/g,',')+'?')+p.join('&')};
$('goFile').onclick=async()=>{const fs=await listFiles(),t=cur();
  const files=fs.map(f=>new File([f.blob],f.name,{type:f.type||'application/octet-stream'}));
  const data={title:fill(t.subject,t),text:buildBody(),files};
  if(!navigator.share||(files.length&&!(navigator.canShare&&navigator.canShare(data))))
    return alert('HP/browser ini tidak bisa membagikan lampiran. Pakai tombol OK, lalu lampirkan manual.');
  try{await navigator.share(data)}catch(e){}};

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
renderAll();
</script>
</body>
</html>
